<!DOCTYPE html>
<html>
<head>
    <title>Device Table</title>
</head>
<body>

<table border="2" cellspacing="5" cellpadding="10">
    <tr bgcolor="orange">
        <th>Device</th>
        <th>Brand</th>
        <th>Specifications</th>
    </tr>

    <tr>
        <td>Smartphone</td>
        <td>Apple</td>
        <td>
            <table border="2" cellspacing="5" cellpadding="10">
                <tr bgcolor="blue">
                    <th>Model</th>
                    <th>Storage</th>
                </tr>
                <tr>
                    <td>iPhone 12 Pro</td>
                    <td>256GB</td>
                </tr>
                <tr>
                    <td>iPhone SE</td>
                    <td>128GB</td>
                </tr>
            </table>
        </td>
    </tr>

    <tr>
        <td>Laptop</td>
        <td>HP</td>
        <td>15.6&quot; Display</td>
    </tr>

    <tr>
        <td>Tablet</td>
        <td>Samsung</td>
        <td>10.5&quot; Display</td>
    </tr>
</table>

</center>

    



</body>
</html>
